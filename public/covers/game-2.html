<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 600px; height: 400px; overflow: hidden; }
  .cover { width: 600px; height: 400px; position: relative; overflow: hidden; }
  .cover-shooter {
    background: radial-gradient(ellipse at 35% 50%, #0d1b3e 0%, #05081a 100%);
  }
  .star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; }
  .star.bright { width: 3px; height: 3px; box-shadow: 0 0 6px #00f0ff; }

  .ship {
    position: absolute; bottom: 100px; right: 70px; width: 140px; height: 80px;
  }
  .ship-body {
    width: 0; height: 0;
    border-left: 24px solid transparent;
    border-right: 24px solid transparent;
    border-bottom: 60px solid #e0e0e0;
    position: absolute; bottom: 0; left: 46px;
    filter: drop-shadow(0 0 20px rgba(0,240,255,0.7));
  }
  .ship-cockpit {
    position: absolute; bottom: 35px; left: 60px;
    width: 20px; height: 14px; background: #00f0ff; border-radius: 6px 6px 0 0;
    box-shadow: 0 0 15px rgba(0,240,255,0.6);
  }
  .ship-wing {
    position: absolute; bottom: -8px; left: 8px;
    width: 124px; height: 24px;
    background: linear-gradient(90deg, #9e9e9e, #e0e0e0);
    border-radius: 6px;
    box-shadow: 0 0 15px rgba(0,240,255,0.5);
  }
  .ship-engine {
    position: absolute; bottom: -38px; left: 46px;
    width: 48px; height: 20px;
    background: linear-gradient(to bottom, #00f0ff, transparent);
    border-radius: 0 0 24px 24px;
    opacity: 0.9;
  }

  .laser {
    position: absolute; height: 3px;
    background: linear-gradient(to left, rgba(0,240,255,0.9), transparent);
  }
  .laser:nth-child(1) { top: 180px; left: 40px; width: 240px; }
  .laser:nth-child(2) { top: 195px; left: 60px; width: 180px; opacity: 0.6; }

  .enemy {
    position: absolute; border-radius: 50%;
    background: #ff3d00;
    box-shadow: 0 0 25px rgba(255,61,0,0.6);
  }
  .enemy:nth-child(1) { top: 70px; left: 130px; width: 34px; height: 24px; border-radius: 50%; }
  .enemy:nth-child(2) { top: 200px; left: 220px; width: 26px; height: 18px; border-radius: 50%; opacity: 0.7; }
  .enemy:nth-child(3) { top: 120px; left: 340px; width: 30px; height: 22px; border-radius: 50%; opacity: 0.6; }
</style>
</head>
<body>
<div class="cover cover-shooter">
  <script>
    for (let i = 0; i < 100; i++) {
      const s = document.createElement('div');
      s.className = 'star' + (Math.random() > 0.6 ? ' bright' : '');
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.opacity = 0.2 + Math.random() * 0.8;
      document.querySelector('.cover').appendChild(s);
    }
    // Add enemies after script runs
    const e1 = document.createElement('div'); e1.className = 'enemy'; document.querySelector('.cover').appendChild(e1);
    const e2 = document.createElement('div'); e2.className = 'enemy'; document.querySelector('.cover').appendChild(e2);
    const e3 = document.createElement('div'); e3.className = 'enemy'; document.querySelector('.cover').appendChild(e3);
  </script>
  <div class="laser"></div><div class="laser"></div>
  <div class="ship">
    <div class="ship-body"></div>
    <div class="ship-cockpit"></div>
    <div class="ship-wing"></div>
    <div class="ship-engine"></div>
  </div>
</div>
</body>
</html>
