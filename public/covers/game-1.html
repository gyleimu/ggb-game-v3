<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 600px; height: 400px; overflow: hidden; font-family: 'Orbitron', sans-serif; }
  .cover { width: 600px; height: 400px; position: relative; overflow: hidden; }
  .cover-fish {
    background: linear-gradient(180deg, #0a3d62 0%, #0c2d4a 40%, #0b1e33 100%);
  }
  .light-ray {
    position: absolute; top: -50px; width: 200px; height: 450px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.08) 0%, transparent 100%);
    transform: skewX(-15deg);
  }
  .light-ray:nth-child(1) { left: 200px; }
  .light-ray:nth-child(2) { left: 100px; opacity: 0.5; }
  .light-ray:nth-child(3) { left: 300px; opacity: 0.3; }

  .hero-fish { position: absolute; bottom: 60px; right: 60px; width: 160px; height: 160px; }
  .hero-fish-body {
    width: 160px; height: 160px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffd54f 0%, #f9a825 50%, #e65100 70%);
    box-shadow: 0 0 80px rgba(255, 152, 0, 0.6), 0 0 150px rgba(255, 152, 0, 0.3);
    position: relative;
  }
  .hero-fish-eye {
    position: absolute; top: 40px; right: 35px;
    width: 26px; height: 30px; background: white; border-radius: 50%;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
  }
  .hero-fish-pupil {
    position: absolute; top: 6px; right: 5px;
    width: 12px; height: 14px; background: #111; border-radius: 50%;
  }
  .hero-fish-mouth {
    position: absolute; top: 70px; right: 18px;
    width: 36px; height: 20px;
    border: 4px solid #e65100; border-radius: 0 0 24px 24px; border-top: none;
  }
  .hero-cape {
    position: absolute; top: 25px; left: -50px;
    width: 100px; height: 120px;
    background: linear-gradient(135deg, #ff1744 0%, #d50000 100%);
    border-radius: 0 70px 70px 0;
    transform: rotate(-15deg);
    box-shadow: 0 0 25px rgba(255, 23, 68, 0.5);
  }

  .small-fish {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #64b5f6, #1976d2);
    box-shadow: 0 0 10px rgba(100,180,246,0.4);
  }
  .sf1 { width: 32px; height: 32px; top: 200px; left: 60px; }
  .sf2 { width: 24px; height: 24px; top: 150px; left: 180px; }
  .sf3 { width: 28px; height: 28px; top: 260px; left: 240px; }
  .sf4 { width: 18px; height: 18px; top: 180px; left: 360px; }
  .sf5 { width: 26px; height: 26px; top: 280px; left: 380px; }
  .sf-tail { position: absolute; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 10px solid #42a5f5; }

  .bubble {
    position: absolute; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.04);
  }
  .b1 { width: 18px; height: 18px; top: 80px; left: 120px; }
  .b2 { width: 12px; height: 12px; top: 120px; left: 320px; }
  .b3 { width: 22px; height: 22px; top: 220px; left: 140px; }
  .b4 { width: 10px; height: 10px; top: 160px; left: 440px; }
  .b5 { width: 14px; height: 14px; top: 300px; left: 80px; }
  .b6 { width: 16px; height: 16px; top: 100px; left: 260px; }
</style>
</head>
<body>
<div class="cover cover-fish">
  <div class="light-ray"></div>
  <div class="light-ray"></div>
  <div class="light-ray"></div>
  <div class="small-fish sf1"></div>
  <div class="small-fish sf2"></div>
  <div class="small-fish sf3"></div>
  <div class="small-fish sf4"></div>
  <div class="small-fish sf5"></div>
  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>
  <div class="bubble b5"></div>
  <div class="bubble b6"></div>
  <div class="hero-fish">
    <div class="hero-cape"></div>
    <div class="hero-fish-body">
      <div class="hero-fish-eye"><div class="hero-fish-pupil"></div></div>
      <div class="hero-fish-mouth"></div>
    </div>
  </div>
</div>
</body>
</html>
